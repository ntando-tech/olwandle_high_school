<body>
    <h1>Olwandle High School</h1>
    <div class=" w3l-login-form">
        <h2 class="myheading">Login Here</h2>
        <form action="#" method="POST">

            <div class=" w3l-form-group">
                <label>Email:</label>
                <div class="group">
                    <i class="fas fa-envelope"></i>
                    <input type="text" class="form-control" maxlength="35" placeholder="Email" required="required" />
                </div>
            </div>
            <div class=" w3l-form-group">
                <label>Password:</label>
                <div class="group">
                    <i class="fas fa-unlock"></i>
                    <input type="password" class="form-control" maxlength="25" placeholder="Password" required="required" />
                </div>
            </div>
            <div class="forgot">
                <a href="forgotpassword.html">Forgot Password?</a>
                <p><input type="checkbox">Remember Me</p>
            </div>
            <button type="submit">Login</button>
        </form>
        <p class=" w3l-register-p">Don't have an account?<a href="signup.html" class="register"> Register</a></p>
    </div>
