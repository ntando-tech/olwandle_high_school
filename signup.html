<head>

    <!-- /custom style sheet -->

    <link href="img/madibapics/logo.webp" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">

<body>
    <h1>Olwandle High School</h1>
    <div class=" w3l-login-form">
        <h2 class="myheading">Register Here</h2>
        <form action="#" method="POST">

            <div class=" w3l-form-group">
                <label>Full Name:</label>
                <div class="group">
                    <i class="fas fa-user"></i>
                    <input type="text" class="form-control" maxlength="40" placeholder="Full Name" required="required" />
                </div>
            </div>
            <div class=" w3l-form-group">
                <label>Email:</label>
                <div class="group">
                    <i class="fas fa-envelope"></i>
                    <input type="text" class="form-control" maxlength="35" placeholder="Email" required="required" />
                </div>
            </div>
            <div class=" w3l-form-group">
                <label>Phone:</label>
                <div class="group">
                    <i class="fas fa-phone-alt"></i>
                    <input type="text" class="form-control" maxlength="10" placeholder="Phone" required="required" />
                </div>
            </div>
            <div class=" w3l-form-group">
                <label>Password:</label>
                <div class="group">
                    <i class="fas fa-unlock"></i>
                    <input type="password" class="form-control" maxlength="22" placeholder="Password" required="required" />
                </div>
            </div>
            <div class=" w3l-form-group">
                <label>Confirm Password:</label>
                <div class="group">
                    <i class="fas fa-unlock"></i>
                    <input type="password" class="form-control" maxlength="22" placeholder="Confim Password" required="required" />
                </div>
            </div>

            <button type="submit">Register</button>
        </form>
        <p class=" w3l-register-p">CLick Here To <a href="signin.html" class="register"> Login</a></p>
    </div>
    <footer>
        <p class="copyright-agileinfo"> &copy; 2026.All Rights Reserved </p>
    </footer>

</body>

</html>
